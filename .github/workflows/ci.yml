name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check formatting & types
        run: |
          npm run format:check
          npm run typecheck

      - name: Resolve SudachiDict version
        id: sudachi
        run: |
          VERSION="${SUDACHIDICT_VERSION:-$(grep -oP '(?<=DEFAULT_VERSION = ")[^"]+' scripts/build-dict.js)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: dict
          key: sudachidict-${{ steps.sudachi.outputs.version }}

      - name: Build dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: npm run build:dict

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
