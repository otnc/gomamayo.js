name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: a semver bump (patch/minor/major/prerelease) or an explicit version (e.g. 2.0.1)'
        required: true
        default: patch

permissions:
  contents: write # push the version commit/tag and create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck

      - name: Resolve SudachiDict version
        id: sudachi
        run: |
          VERSION="${SUDACHIDICT_VERSION:-$(grep -oP '(?<=DEFAULT_VERSION = ")[^"]+' scripts/build-dict.js)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: dict
          key: sudachidict-${{ steps.sudachi.outputs.version }}

      # 失敗時 (AWS S3 障害など) はここでジョブが止まり、以降のバージョンbump・publishには進まない
      - name: Build dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: npm run build:dict

      - run: npm test
      - run: npm run build

      - name: Bump version
        id: bump
        run: |
          OLD="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.version }}" = "prerelease" ]; then
            npm version prerelease --preid=dev --no-git-tag-version --allow-same-version >/dev/null
          else
            npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          fi
          NEW="$(node -p "require('./package.json').version")"
          echo "version=v${NEW}" >> "$GITHUB_OUTPUT"
          if echo "$NEW" | grep -q 'dev'; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is already ${NEW}; skipping the bump commit but still releasing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # npm CLI must be >=11.5.1 for trusted publishing (OIDC); pin explicitly
      # since the version bundled with actions/setup-node can lag behind.
      - run: npm install -g npm@11

      - name: Publish to npm
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already published; skipping npm publish."
          else
            npm publish --access public --provenance --tag "${{ steps.bump.outputs.tag }}"
          fi

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            git commit -am "release: ${{ steps.bump.outputs.version }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.version }}" >/dev/null; then
            git tag "${{ steps.bump.outputs.version }}"
          fi
          git push origin HEAD "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.bump.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; skipping."
            exit 0
          fi
          EXTRA_ARGS=""
          if [ "${{ steps.bump.outputs.tag }}" = "dev" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$TAG" dict/readings.tsv.gz \
            --title "$TAG" \
            --generate-notes \
            $EXTRA_ARGS
