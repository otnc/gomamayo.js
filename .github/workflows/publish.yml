name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting & types
        run: |
          npm run format:check
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit dist directory (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          # The following command creates a commit ONLY if there are staged changes.
          git diff --staged --quiet || git commit -m "chore: update build artifacts"
          git push

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # If version includes 'dev', publish with 'dev' tag, otherwise use 'latest'
          if echo "$VERSION" | grep -q 'dev'; then
            TAG=dev
          else
            TAG=latest
          fi
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag and GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"
          EXTRA_ARGS=""
          if echo "$VERSION" | grep -q 'dev'; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "v$VERSION" dict/readings.tsv.gz \
            --title "v$VERSION" \
            --generate-notes \
            $EXTRA_ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
